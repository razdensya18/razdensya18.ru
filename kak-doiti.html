<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Как дойти · Razden’sya</title>
<link rel="preload" href="common/mulish-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="common/brand.css">
<style>
.addr { margin-top: 16px }
.map { position: relative; display: block; margin-top: 12px; aspect-ratio: 13 / 8; border-radius: 22px; overflow: hidden; background: #e9e1d1; box-shadow: 0 10px 26px -18px rgba(74,56,16,.6) }
.map img { display: block; width: 100%; height: 100%; object-fit: cover }
.map .open { position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 6px; background: var(--dark); color: #fbf5ea; font-size: 12px; font-weight: 800; padding: 7px 11px; border-radius: 999px }
.map .open svg { width: 14px; height: 14px; fill: currentColor }
.addr h1 { margin: 0 0 4px; font: 400 32px/1.05 var(--f-display) }
.addr p { margin: 0; font-size: 14px; color: var(--text) }
.addr .copy { margin-top: 8px; border: 0; background: none; color: var(--gold-t); font-weight: 800; font-size: 13px; padding: 0; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.addr .copy svg { width: 16px; height: 16px; fill: currentColor }
.go { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px }
.go a { display: grid; justify-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px; background: var(--card); text-decoration: none; font-size: 12.5px; font-weight: 800; color: var(--ink); box-shadow: 0 8px 20px -16px rgba(74,56,16,.6) }
.go .ci { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px }
.go .ci svg { width: 20px; height: 20px; fill: #fff }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px }
.facts span { font-size: 12px; font-weight: 700; color: var(--text); background: var(--paper); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px }
.step { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; background: var(--card); border-radius: 18px; padding: 10px }
.quick { margin-top: 16px; background: var(--dark); border-radius: 22px; padding: 16px; display: grid; gap: 8px }
.quick .k { font-size: 10.5px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #dcb35a }
.quick .btn { min-height: 46px; font-size: 14.5px }
.quick .btn-line { background: transparent; color: #f5ecda; border-color: rgba(220,179,90,.55) }
.quick .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.note { font-size: 11.5px; color: var(--muted); text-align: center; margin: 10px 0 0 }
</style>
</head>
<body data-page="13" data-site="tisnenie">
<main class="col">
  <section class="card addr">
    <span class="eyebrow">как дойти</span>
    <h1 id="adr"></h1>
    <p id="adr2"></p>
    <button type="button" class="copy" id="copy" data-icon="copy">Скопировать адрес</button>
  </section>

  <a class="map" id="map" target="_blank" rel="noopener" aria-label="Открыть дом на Яндекс Картах">
    <img id="mapi" alt="Дом на карте: ул. Архитектора Сергея Макарова, 6/1" loading="lazy" width="650" height="400">
    <span class="open" data-icon="pin">Открыть карту</span>
  </a>

  <nav class="go" aria-label="Маршрут">
    <a id="ya" target="_blank" rel="noopener"><span class="ci" style="background:#e03a2f">Я</span>Яндекс Карты</a>
    <a id="gis" target="_blank" rel="noopener"><span class="ci" style="background:#2e9b4a">2Г</span>2ГИС</a>
    <a id="taxi" target="_blank" rel="noopener"><span class="ci" style="background:#1f1a14;color:#fc3">⟶</span>Такси</a>
  </nav>
  <div class="facts" id="facts"></div>

  <section class="quick">
    <span class="k">быстрое сообщение Марине</span>
    <button type="button" class="btn btn-gold" data-q="Марина, я на месте, подхожу к кабинету.">Я на месте</button>
    <div class="row">
      <button type="button" class="btn btn-line" data-q="Марина, опаздываю минут на 10, извините!">Опаздываю на 10 мин</button>
      <button type="button" class="btn btn-line" data-q="Марина, не могу найти вход. Подскажите, пожалуйста?">Не найду вход</button>
    </div>
  </section>

  <div class="contacts" style="margin-top:18px"></div>
  <p class="signature"></p>
</main>
<script src="common/brand.js"></script>
<script>
(function () {
  var R = Razden, $ = function (id) { return document.getElementById(id) };
  // Адрес кабинета: дом ЖК Znak (по документам — с. Первомайский, Завьяловский район), точка — Яндекс Карты, id дома — 2ГИС
  var PLACE = { street: "ул. Архитектора Сергея Макарова, 6/1", note: "2-й подъезд · ЖК Znak, Солнечные кварталы", copy: "Ижевск, ул. Архитектора Сергея Макарова, 6/1, 2-й подъезд",
    lat: 56.873392, lon: 53.315255, gis: "70030076366533952", facts: ["2-й подъезд", "ЖК Znak", "Солнечные кварталы"] };
  $("adr").textContent = PLACE.street; $("adr2").textContent = PLACE.note;
  $("mapi").src = "https://static-maps.yandex.ru/1.x/?ll=" + PLACE.lon + "," + PLACE.lat + "&z=16&size=650,400&l=map&pt=" + PLACE.lon + "," + PLACE.lat + ",pm2rdm";
  $("mapi").onerror = function () { $("map").hidden = true };
  $("map").href = "https://yandex.ru/maps/?pt=" + PLACE.lon + "," + PLACE.lat + "&z=17&l=map";
  $("ya").href = "https://yandex.ru/maps/?rtext=~" + PLACE.lat + "," + PLACE.lon + "&rtt=auto";
  $("gis").href = "https://2gis.ru/izhevsk/directions/points/%7C" + PLACE.lon + "%2C" + PLACE.lat + "%3B" + PLACE.gis;
  $("taxi").href = "https://3.redirect.appmetrica.yandex.com/route?end-lat=" + PLACE.lat + "&end-lon=" + PLACE.lon + "&appmetrica_tracking_id=1178268795219780156";
  $("facts").innerHTML = PLACE.facts.map(function (f) { return "<span>" + f + "</span>" }).join("");
  $("copy").addEventListener("click", function () { R.copy(PLACE.copy).then(function () { R.toast("Адрес скопирован") }) });
  document.querySelectorAll("[data-q]").forEach(function (b) { b.addEventListener("click", function () { R.send(b.dataset.q, { title: "Сообщение Марине" }) }) });
})();
</script>
</body>
</html>
